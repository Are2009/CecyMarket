{% extends "base.html" %}
{% block title %}Editar donación{% endblock %}
{% block content %}

<section class="formulario-donacion">

    <h2>Editar donación</h2>
    <p>Modifica la información del artículo.</p>

    <form method="POST">

        <label>Prenda o material</label>
        <input type="text" name="prenda" value="{{ donacion['prenda'] }}" required>

        <label>Talla</label>
        <input type="text" name="talla" value="{{ donacion['talla'] or '' }}">

        <label>Estado</label>
        <select name="estado" required>
            <option value="Nuevo" {% if donacion['estado'] == 'Nuevo' %}selected{% endif %}>Nuevo</option>
            <option value="Usado" {% if donacion['estado'] == 'Usado' %}selected{% endif %}>Usado</option>
        </select>

        <button type="submit">Guardar cambios</button>
        <a href="{{ url_for('listado') }}" class="btn">Cancelar</a>

    </form>

</section>

{% endblock %}
